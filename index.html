button { margin:5px; padding:8px 12px; cursor:pointer;}
.correct { color:green; font-weight:bold;}

</style>
</head>
<body>

<div id="quiz"></div>

<button onclick="resetQuiz()">Reset Quiz</button>

function loadQuiz(){
let container=document.getElementById("quiz");
container.innerHTML="";
quizData.forEach((q,i)=>{
let div=document.createElement("div");
div.className="question";
let html=`<p>${i+1}. ${q.q}</p>`;
q.a.forEach((opt,j)=>{
html+=`<button onclick="check(${i},${j},this)">${opt}</button>`;
});
html+=`<p id="res${i}"></p>`;
div.innerHTML=html;
container.appendChild(div);
});
}

function check(i,j,btn){
let res=document.getElementById("res"+i);
if(j===quizData[i].correct){
res.innerHTML=`<span class="correct">✔ Correct</span> - ${quizData[i].explain}`;
}else{
res.innerHTML=`<span class="wrong">✘ Wrong</span> - ${quizData[i].explain}`;
}
}

function resetQuiz(){
loadQuiz();
}

loadQuiz();

</script>
