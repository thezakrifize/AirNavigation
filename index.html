<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aviation Basic Quiz 60 ข้อ</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --correct: #16a34a;
      --wrong: #dc2626;
      --border: #334155;
      --card: #0b1220;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0f172a, #020617);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .hero p {
      margin: 0;
      color: #e0f2fe;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 12px;
      align-items: center;
      background: rgba(15, 23, 42, .9);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      position: sticky;
      top: 12px;
      z-index: 10;
      backdrop-filter: blur(8px);
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .stat strong { color: var(--text); }

    button {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: .2s ease;
    }

    button:hover { transform: translateY(-1px); }
    .btn-primary { background: #0284c7; }
    .btn-secondary { background: #475569; }
    .btn-success { background: #16a34a; }

    .section-title {
      margin: 28px 0 14px;
      font-size: 20px;
      color: #bae6fd;
      border-left: 5px solid var(--accent);
      padding-left: 12px;
    }

    .quiz {
      display: grid;
      gap: 16px;
    }

    .card {
      background: rgba(11, 18, 32, .95);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .22);
    }

    .q-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      align-items: start;
    }

    .q-num {
      color: #7dd3fc;
      font-weight: 700;
      min-width: 76px;
    }

    .q-text {
      flex: 1;
      font-size: 18px;
    }

    .choices {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .choice {
      width: 100%;
      text-align: left;
      background: var(--panel);
      color: var(--text);
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 500;
    }

    .choice:hover:not(.locked) {
      background: #172554;
      border-color: #3b82f6;
    }

    .choice.correct {
      background: rgba(22,163,74,.18);
      border-color: var(--correct);
      color: #dcfce7;
    }

    .choice.wrong {
      background: rgba(220,38,38,.18);
      border-color: var(--wrong);
      color: #fee2e2;
    }

    .choice.locked {
      cursor: default;
    }

    .explanation {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
    }

    .explanation.show { display: block; }
    .explanation.correct { border-left: 4px solid var(--correct); }
    .explanation.wrong { border-left: 4px solid var(--wrong); }

    .footer-box {
      margin-top: 24px;
      background: rgba(15, 23, 42, .95);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .result {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .mini {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 860px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
      .q-head {
        flex-direction: column;
      }
      .q-num { min-width: auto; }
    }
  </style>
</head>

    </div>
  </div>

    const correctCountEl = document.getElementById('correctCount');
    const scorePercentEl = document.getElementById('scorePercent');
    const finalResultEl = document.getElementById('finalResult');
    const resetBtn = document.getElementById('resetBtn');
    const checkBtn = document.getElementById('checkBtn');
    const topBtn = document.getElementById('topBtn');

    let state = [];

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildQuiz() {
      quizEl.innerHTML = '';
      state = questions.map((q, idx) => {
        const order = shuffleArray(q.choices.map((choice, i) => ({ choice, originalIndex: i })));
        const remappedAnswer = order.findIndex(x => x.originalIndex === q.answer);
        return {
          selected: null,
          locked: false,
          correct: false,
          order,
          remappedAnswer,
          qIndex: idx
        };
      });

      let currentSection = '';
      questions.forEach((q, idx) => {
        if (q.section !== currentSection) {
          currentSection = q.section;
          const sectionTitle = document.createElement('div');
          sectionTitle.className = 'section-title';
          sectionTitle.textContent = currentSection;
          quizEl.appendChild(sectionTitle);
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = idx;

        const qHead = document.createElement('div');
        qHead.className = 'q-head';
        qHead.innerHTML = `
          <div class="q-num">ข้อ ${idx + 1}</div>
          <div class="q-text">${q.q}</div>
        `;
        card.appendChild(qHead);

        const choicesWrap = document.createElement('div');
        choicesWrap.className = 'choices';

        state[idx].order.forEach((item, choiceIndex) => {
          const btn = document.createElement('button');
          btn.className = 'choice';
          btn.innerHTML = `<strong>${String.fromCharCode(65 + choiceIndex)}.</strong> ${item.choice}`;
          btn.addEventListener('click', () => answerQuestion(idx, choiceIndex, btn, card));
          choicesWrap.appendChild(btn);
        });

        const explanation = document.createElement('div');
        explanation.className = 'explanation';
        explanation.id = `exp-${idx}`;

        card.appendChild(choicesWrap);
        card.appendChild(explanation);
        quizEl.appendChild(card);
      });

      updateStats();
      finalResultEl.textContent = 'ยังไม่ได้สรุปคะแนน';
    }

    function answerQuestion(qIdx, selectedChoice, clickedBtn, card) {
      const qState = state[qIdx];
      if (qState.locked) return;

      qState.selected = selectedChoice;
      qState.locked = true;
      qState.correct = selectedChoice === qState.remappedAnswer;

      const buttons = card.querySelectorAll('.choice');
      buttons.forEach((btn, i) => {
        btn.classList.add('locked');
        if (i === qState.remappedAnswer) btn.classList.add('correct');
        if (i === selectedChoice && selectedChoice !== qState.remappedAnswer) btn.classList.add('wrong');
      });

      const exp = document.getElementById(`exp-${qIdx}`);
      exp.className = `explanation show ${qState.correct ? 'correct' : 'wrong'}`;
      exp.innerHTML = `${qState.correct ? '✅ ตอบถูก' : '❌ ตอบผิด'} — เฉลย: <strong>${String.fromCharCode(65 + qState.remappedAnswer)}</strong>. ${questions[qIdx].orderText || questions[qIdx].explanation}`;

      updateStats();
    }

    function updateStats() {
      const answered = state.filter(s => s.locked).length;
      const correct = state.filter(s => s.correct).length;
      const percent = Math.round((correct / questions.length) * 100);
      answeredCountEl.textContent = answered;
      correctCountEl.textContent = correct;
      scorePercentEl.textContent = `${percent}%`;
    }

    function summarizeScore() {
      const answered = state.filter(s => s.locked).length;
      const correct = state.filter(s => s.correct).length;
      const wrong = answered - correct;
      const percent = Math.round((correct / questions.length) * 100);

      let level = 'เริ่มต้น';
      if (percent >= 85) level = 'ดีมาก';
      else if (percent >= 70) level = 'ดี';
      else if (percent >= 50) level = 'พอใช้';

      finalResultEl.textContent = `คะแนน ${correct}/${questions.length} (${percent}%) — ตอบแล้ว ${answered} ข้อ, ผิด ${wrong} ข้อ, ระดับ: ${level}`;
    }

    resetBtn.addEventListener('click', buildQuiz);
    checkBtn.addEventListener('click', summarizeScore);
    topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    buildQuiz();
  </script>
</body>
</html>
