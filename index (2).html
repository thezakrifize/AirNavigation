<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Navigation Quiz - 40 Questions</title>
  <style>
    :root {
      --c1: #8ecae6;
      --c2: #219ebc;
      --c3: #023047;
      --c4: #ffb703;
      --c5: #fb8500;
      --bg: #f6fbfe;
      --card: #ffffff;
      --text: #173042;
      --muted: #5b7080;
      --success-bg: #e8fff2;
      --success-border: #2e8b57;
      --error-bg: #fff1f0;
      --error-border: #d64545;

      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", "Helvetica Neue", Arial, sans-serif;

        radial-gradient(circle at top left, rgba(142,202,230,0.35), transparent 32%),
        radial-gradient(circle at top right, rgba(255,183,3,0.20), transparent 22%),

      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .hero {
      background: linear-gradient(135deg, rgba(2,48,71,0.98), rgba(33,158,188,0.95));
      color: white;
      border-radius: 28px;
      padding: 28px 28px 24px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 12px;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: clamp(1.6rem, 2vw, 2.4rem);
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 0;
      color: rgba(255,255,255,0.85);
      font-size: 0.98rem;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      font: inherit;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .btn-reset {
      background: linear-gradient(135deg, var(--c4), var(--c5));
      color: #2b1a00;
    }

    .btn-top {
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: none;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .progress-wrap {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.9);
      gap: 12px;
      flex-wrap: wrap;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--c1), var(--c4));
      transition: width 0.25s ease;
      border-radius: 999px;
    }

    .quiz-grid {
      margin-top: 24px;
      display: grid;
      gap: 18px;
    }

    .card {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(2,48,71,0.08);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .q-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      padding: 6px 14px;
      background: linear-gradient(135deg, rgba(142,202,230,0.25), rgba(33,158,188,0.18));
      color: var(--c3);
      border-radius: 999px;
      font-weight: 800;
      margin-bottom: 12px;
      border: 1px solid rgba(33,158,188,0.16);
    }

    .question {
      font-size: 1.06rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--c3);
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      background: #fff;
      border: 1px solid rgba(2,48,71,0.12);
      color: var(--text);
      box-shadow: 0 3px 10px rgba(2,48,71,0.03);
    }

    .choice:hover:not(:disabled) {
      border-color: rgba(33,158,188,0.45);
      background: linear-gradient(180deg, #ffffff, #f7fdff);
    }

    .choice:disabled {
      cursor: default;
      opacity: 1;
    }

    .choice.correct {
      border: 2px solid var(--success-border);
      background: var(--success-bg);
    }

    .choice.wrong {
      border: 2px solid var(--error-border);
      background: var(--error-bg);
    }

    .choice.reveal {
      border: 2px solid #0f6d85;
      background: #eefbff;
    }

    .choice-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      margin-right: 10px;
      background: linear-gradient(135deg, rgba(142,202,230,0.35), rgba(33,158,188,0.22));
      color: var(--c3);
      font-weight: 800;
      font-size: 0.92rem;
    }

    .feedback {
      margin-top: 14px;
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: none;
      border: 1px solid rgba(2,48,71,0.08);
    }

    .feedback.show {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    .feedback.correct {
      background: var(--success-bg);
      border-color: rgba(46,139,87,0.35);
    }

    .feedback.wrong {
      background: var(--error-bg);
      border-color: rgba(214,69,69,0.28);
    }

    .feedback-title {
      font-weight: 800;
      margin-bottom: 6px;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      .hero {
        position: static;
      }
      .card {
        padding: 18px;
      }
      .question {
        font-size: 1rem;
      }
      .choice {
        padding: 12px 14px;
      }
    }
  </style>
</head>

    const quizEl = document.getElementById('quiz');
    const answeredText = document.getElementById('answeredText');
    const scoreText = document.getElementById('scoreText');
    const progressFill = document.getElementById('progressFill');

    let state = [];

    function initState() {
      state = questions.map(() => ({
        selected: null,
        locked: false,
        correct: false
      }));
    }

    function letter(index) {
      return ['A', 'B', 'C', 'D'][index];
    }

    function renderQuiz() {
      quizEl.innerHTML = '';
      questions.forEach((q, qi) => {
        const card = document.createElement('section');
        card.className = 'card';

        const number = document.createElement('div');
        number.className = 'q-number';
        number.textContent = `Question ${qi + 1}`;
        card.appendChild(number);

        const question = document.createElement('div');
        question.className = 'question';
        question.innerHTML = `<div>${q.question}</div><div style="margin-top:6px;color:var(--muted);font-weight:600;font-size:0.96rem;">${q.question_th}</div>`;
        card.appendChild(question);

        const choices = document.createElement('div');
        choices.className = 'choices';

        q.choices.forEach((choiceText, ci) => {
          const btn = document.createElement('button');
          btn.className = 'choice';
          btn.disabled = state[qi].locked;
          btn.dataset.qi = qi;
          btn.dataset.ci = ci;

          if (state[qi].locked) {
            if (ci === q.answer && state[qi].selected === ci) {
              btn.classList.add('correct');
            } else if (ci === q.answer) {
              btn.classList.add('reveal');
            } else if (state[qi].selected === ci && ci !== q.answer) {
              btn.classList.add('wrong');
            }
          }

          btn.innerHTML = `<span class="choice-label">${letter(ci)}</span><div style="display:inline-block;vertical-align:top;max-width:calc(100% - 48px);"><div>${choiceText.en}</div><div style="color:var(--muted);font-size:0.93rem;margin-top:3px;">${choiceText.th}</div></div>`;
          btn.addEventListener('click', () => handleAnswer(qi, ci));
          choices.appendChild(btn);
        });

        card.appendChild(choices);

        const feedback = document.createElement('div');
        const isAnswered = state[qi].locked;
        feedback.className = 'feedback' + (isAnswered ? ' show ' + (state[qi].correct ? 'correct' : 'wrong') : '');
        if (isAnswered) {
          const title = state[qi].correct ? '✅ Correct' : '❌ Incorrect';
          const picked = `Your answer: ${letter(state[qi].selected)}`;
          const correct = `Correct answer: ${letter(q.answer)}`;
          feedback.innerHTML = `
            <div class="feedback-title">${title}</div>
            <div>${picked} · ${correct}</div>
            <div style="margin-top:6px;">${q.explanation}</div>
          `;
        }
        card.appendChild(feedback);

        quizEl.appendChild(card);
      });

      updateProgress();
    }

    function handleAnswer(qi, ci) {
      if (state[qi].locked) return;
      state[qi].selected = ci;
      state[qi].locked = true;
      state[qi].correct = ci === questions[qi].answer;
      renderQuiz();
    }

    function updateProgress() {
      const answered = state.filter(s => s.locked).length;
      const correct = state.filter(s => s.correct).length;
      answeredText.textContent = `Answered: ${answered} / ${questions.length}`;
      scoreText.textContent = `Correct: ${correct}`;
      progressFill.style.width = `${(answered / questions.length) * 100}%`;
    }

    function resetQuiz() {
      initState();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    initState();
    renderQuiz();
  </script>
